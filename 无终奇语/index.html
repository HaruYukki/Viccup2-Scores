<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>无终奇语计分板</title><meta name="description" content="记录探索过程，实时计算个人得分。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23112632'/%3E%3Cpath d='M8 10h16M8 16h10M8 22h16' stroke='%235ee2bd' stroke-width='3'/%3E%3C/svg%3E"><style>
:root{color-scheme:dark;--bg:#0b141c;--panel:#14212c;--line:#2a3c48;--muted:#a9bcc8;--mint:#68e4bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf4f8;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:36px 24px 64px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:28px;margin:0;letter-spacing:2px}header p{margin:5px 0 0;color:var(--muted);font-size:14px}.mark{border-left:4px solid var(--mint);padding-left:16px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px}h2{font-size:18px;margin:0 0 20px;display:flex;align-items:center;gap:12px}h2 span{font-size:13px;color:var(--mint);font-weight:500;letter-spacing:1px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{cursor:pointer}input[type=number]{width:100%;background:#0c1923;border:1px solid #435967;border-radius:8px;color:#fff;padding:11px 12px;font:inherit;min-width:0}input:focus-visible,button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}input:invalid{border-color:#ff968f}input[type=checkbox]{width:20px;height:20px;accent-color:var(--mint);flex-shrink:0}small,.hint{color:var(--muted);font-size:14px}.fields label>span{display:block;margin-bottom:8px}.row{border-top:1px solid var(--line);padding:16px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.row:last-child{padding-bottom:0}.row:first-of-type{border-top:0;padding-top:0}.check{display:flex;align-items:center;gap:10px}.points{color:var(--mint);white-space:nowrap;font-variant-numeric:tabular-nums}.negative{color:#ffac9f}.sub{margin:10px 0 0 30px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}.sub:has(input:disabled){opacity:.45}.stepper{display:flex;gap:6px;align-items:center}.stepper input{width:75px;text-align:center;padding:8px 3px}.stepper button{width:40px;height:42px;border-radius:8px;border:1px solid #49675f;background:#213f3a;color:var(--mint);font:24px system-ui;cursor:pointer}.stepper button:hover{background:#30554b}.row-title small{display:block;margin-top:2px}.total{position:sticky;top:24px;background:#163a35;border-color:#315d51}.eyebrow{font-size:14px;color:#c1dcd2}.score{font-size:54px;font-weight:700;line-height:1.25;margin:16px 0 6px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;color:#a0ffdc}.score small{font-weight:400;font-size:16px;color:#c1dcd2}.breakdown{margin-top:26px;border-top:1px solid #396155;padding-top:12px}.line{display:flex;justify-content:space-between;gap:12px;margin:12px 0;font-size:14px}.formula{font-size:14px;color:#bdd6cc;border-top:1px solid #396155;padding-top:18px;margin-top:20px}.notice{font-size:14px;color:#e5d591;min-height:24px}.time-input{display:flex;align-items:center;gap:12px}.time-input input{max-width:190px}.time-result{color:var(--mint);margin-top:14px}.hint{margin:12px 0 0}button.reset{background:transparent;color:var(--muted);border:1px solid var(--line);padding:9px 14px;border-radius:8px;font:14px system-ui;cursor:pointer}button.reset:hover{color:#fff;border-color:#a9bcc8}@media(max-width:800px){.layout{grid-template-columns:1fr}.total{position:static;grid-row:1}.score{font-size:44px}.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin-top:16px}.formula{margin-top:12px}main{padding:22px 14px}.panel{padding:20px}.fields{gap:12px}h1{font-size:24px}}@media(max-width:380px){.fields{grid-template-columns:1fr}.row{gap:6px}.stepper input{width:58px}.panel{padding:16px}}
input[type=radio]{width:20px;height:20px;accent-color:var(--mint)}fieldset{border:0;padding:0;margin:0;min-width:0}legend{margin-bottom:10px}.difficulty{display:flex;gap:20px;flex-wrap:wrap}.options{display:flex;flex-wrap:wrap;gap:0 14px}.options .sub{margin-left:30px}header{gap:12px}.reset{flex-shrink:0}@media(max-width:450px){h1{font-size:21px;letter-spacing:0}.score{font-size:40px}} #boss .row:last-child{padding-bottom:16px}.topnav{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px;font-size:14px;color:var(--muted)}.topnav a{color:var(--mint);text-decoration:none;padding:6px 0}.topnav a:hover{text-decoration:underline}.topnav a:focus-visible{outline:2px solid var(--mint);outline-offset:4px}.topnav span{padding:6px 0}
/* Emergency choices share a row; boss modifiers keep their existing layout. */
#emergency .row>div{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:clamp(24px,3vw,44px);flex:1;min-width:0}
#emergency .options{display:block}
#emergency .options .sub{margin:0;white-space:nowrap}
#emergency .row>.points{min-width:76px;text-align:right;margin-left:12px}
@media(max-width:440px){
#emergency .row>div{grid-template-columns:1fr;row-gap:10px}
#emergency .options .sub{margin-left:30px}
#emergency .row>.points{min-width:64px;margin-left:0}
}
</style></head><body><main><nav class="topnav"><a href="../index.html">← 返回首页</a><span id="save-status" role="status">本局输入自动保存</span></nav><header><div class="mark"><h1>无终奇语计分板</h1></div><button class="reset" id="reset" type="button">清空本局</button></header><div class="layout"><div><section class="panel"><h2><span>01</span> 通关结算</h2><div class="fields"><label><span>游戏内结算分</span><input id="settlement" type="number" min="0" step="1" placeholder="输入结算得分"></label><fieldset><legend>挑战难度</legend><div class="difficulty"><label class="check"><input type="radio" name="difficulty" id="n16" value="1" checked>N16</label><label class="check"><input type="radio" name="difficulty" id="n18" value="1.4">N18</label></div></fieldset></div></section><section class="panel"><h2><span>02</span> 紧急作战加分</h2><div id="emergency"></div></section><section class="panel"><h2><span>03</span> BOSS 作战加分</h2><div id="boss"></div><div class="row"><label class="check"><input type="checkbox" id="ancestor">携带滚动先祖</label><span class="points">+500</span></div></section><section class="panel"><h2><span>04</span> 非作战加分</h2><div id="repeat"></div></section></div><aside class="panel total"><div class="eyebrow">个人得分</div><div class="score"><output id="total" aria-live="polite">0</output> <small>分</small></div><div class="notice" id="notice"></div><div class="breakdown"><div class="line"><strong>游戏内结算分</strong><strong id="raw">0</strong></div><div class="line"><span>紧急作战加分</span><span id="emergency-sum">0</span></div><div class="line"><span>BOSS 作战加分</span><span id="boss-sum">0</span></div><div class="line"><span>携带滚动先祖</span><span id="ancestor-sum">0</span></div><div class="line"><span>非作战加分</span><span id="repeat-sum">0</span></div><div class="line"><strong>特殊得分合计</strong><strong id="special">0</strong></div><div class="line"><span>难度系数</span><span id="factor">×1</span></div></div><div class="formula">个人得分 =<br>（游戏内结算分 ＋ 特殊得分）<br>× 难度系数</div></aside></div></main><script>
const emergency=[['vent','排风口',1.96],['fire','火力小队',3],['mobile','机动队',10],['grimoire','溃乱魔典',3.79],['chaos','混沌',100],['ghost','神出鬼没',120],['dispute','争议频发',120],['scarlet','猩红甬道',30],['innocent','无罪净土',21],['city','寄人城池下',80],['system','建制',100],['rhine','莱茵卫士',100],['plant','计划耕种',80],['thirst','神圣的渴求',120],['consensus','谋求共识',120],['outsider','外道',150],['paradise','洞天福地',200],['road','鸭速公路',50]];
const bosses=[['audience','朝谒',150],['teaching','授法',300],['egg','不容拒绝',300]];
const repeats=[['recruit4','4 星临时招募',10],['recruit5','5 星临时招募',20],['recruit6','6 星临时招募',50],['duck','鸭狗熊鼠',50]];
const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n),signed=n=>(n>0?'+':'')+fmt(n);
function combatRow([id,name,p],isBoss){return '<div class="row"><div><label class="check"><input id="'+id+'" type="checkbox"><span>'+name+'</span></label><div class="options"><label class="sub"><input id="'+id+'-chaos" type="checkbox" disabled>混乱状态</label>'+(id==='egg'?'<label class="sub"><input id="egg-large" type="checkbox" disabled>超大蛋</label>':'')+(id==='teaching'?'<label class="sub"><input id="teaching-failed" type="checkbox" disabled>未击败 BOSS（25%）</label>':'')+'</div></div><span class="points" id="'+id+'-points">+'+p+'</span></div>'}
$('emergency').innerHTML=emergency.map(x=>combatRow(x,false)).join('');$('boss').innerHTML=bosses.map(x=>combatRow(x,true)).join('');
$('repeat').innerHTML=repeats.map(([id,name,p])=>'<div class="row"><div class="row-title"><label for="'+id+'">'+name+'</label><small>+'+p+' 分 / 次 · <span id="'+id+'-subtotal">0</span> 分</small></div><div class="stepper"><input id="'+id+'" type="number" min="0" max="999999999" step="1" value="0" aria-label="'+name+'次数"><button type="button" data-add="'+id+'" aria-label="'+name+'加一次">+</button></div></div>').join('');
function number(id){return $(id).value===''?0:Number($(id).value)}
function syncOption(id,parent){$(id).disabled=!$(parent).checked;if(!$(parent).checked)$(id).checked=false}
function calculate(){let e=0,b=0,r=0;for(const[id,,p]of emergency){syncOption(id+'-chaos',id);const v=p+($(id+'-chaos').checked?20:0);$(id+'-points').textContent=signed(v);if($(id).checked)e+=v}for(const[id,,p]of bosses){syncOption(id+'-chaos',id);if(id==='egg')syncOption('egg-large',id);if(id==='teaching')syncOption('teaching-failed',id);const base=id==='egg'&&$('egg-large').checked?800:p;const v=base*($(id+'-chaos').checked?1.5:1)*(id==='teaching'&&$('teaching-failed').checked?.25:1);$(id+'-points').textContent=signed(v);if($(id).checked)b+=v}
const fields=['settlement',...repeats.map(x=>x[0])];if(fields.some(id=>!$(id).validity.valid||!Number.isFinite(number(id)))){for(const id of ['total','raw','emergency-sum','boss-sum','ancestor-sum','repeat-sum','special'])$(id).textContent='—';$('notice').textContent='结算分和次数应为非负整数。';return null}for(const[id,,p]of repeats){const v=number(id)*p;r+=v;$(id+'-subtotal').textContent=signed(v)}const ancestor=$('ancestor').checked?500:0,raw=number('settlement'),factor=$('n18').checked?1.4:1,special=e+b+ancestor+r,total=(raw+special)*factor;for(const[id,n]of Object.entries({raw,'emergency-sum':e,'boss-sum':b,'ancestor-sum':ancestor,'repeat-sum':r,special,total}))$(id).textContent=fmt(n);$('factor').textContent='×'+factor;$('notice').textContent=$('settlement').value===''?'填写结算分后完成结算':'已按当前输入实时结算';return{raw,emergency:e,boss:b,ancestor,nonCombat:r,special,factor,total}}
document.addEventListener('input',calculate);document.addEventListener('change',calculate);document.addEventListener('click',event=>{const id=event.target.dataset.add;if(!repeats.some(x=>x[0]===id))return;const n=number(id);if(Number.isSafeInteger(n)&&n>=0&&n<999999999){$(id).value=n+1;calculate()}});
$('reset').onclick=()=>{if(!confirm('清空本局所有输入和勾选？'))return;document.querySelectorAll('input').forEach(el=>{if(el.type==='checkbox')el.checked=false;else if(el.type==='radio')el.checked=el.id==='n16';else el.value=el.id==='settlement'?'':'0'});calculate()};calculate();
</script>
<script>
(()=>{
const key="viccup2:无终奇语:v1";
const inputs=[...document.querySelectorAll('input[id]')];
const status=document.getElementById('save-status');
function save(){try{const values={};for(const el of inputs)values[el.id]=(el.type==='checkbox'||el.type==='radio')?el.checked:el.value;localStorage.setItem(key,JSON.stringify(values));status.textContent='本局已自动保存';}catch{status.textContent='当前浏览器无法保存，请勿关闭页面';}}
try{const values=JSON.parse(localStorage.getItem(key)||'null');if(values&&typeof values==='object'){for(const el of inputs){const v=values[el.id];if(el.type==='checkbox'||el.type==='radio'){if(typeof v==='boolean')el.checked=v;}else if(typeof v==='string'&&v.length<64)el.value=v;}calculate();status.textContent='已恢复本局记录';}}catch{status.textContent='当前浏览器无法恢复记录';}
document.addEventListener('input',save);document.addEventListener('change',save);
document.addEventListener('click',e=>{if(e.target.closest('[data-add]')||e.target.closest('#reset'))save();});
window.addEventListener('pagehide',save);
})();
</script></body></html>
