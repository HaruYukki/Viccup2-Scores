<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黑流树海计分台</title><meta name="description" content="记录探索过程，实时计算个人得分。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23112632'/%3E%3Cpath d='M8 10h16M8 16h10M8 22h16' stroke='%235ee2bd' stroke-width='3'/%3E%3C/svg%3E"><style>
:root{color-scheme:dark;--bg:#0b141c;--panel:#14212c;--line:#2a3c48;--muted:#a9bcc8;--mint:#68e4bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf4f8;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:36px 24px 64px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:28px;margin:0;letter-spacing:2px}header p{margin:5px 0 0;color:var(--muted);font-size:14px}.mark{border-left:4px solid var(--mint);padding-left:16px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px}h2{font-size:18px;margin:0 0 20px;display:flex;align-items:center;gap:12px}h2 span{font-size:13px;color:var(--mint);font-weight:500;letter-spacing:1px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{cursor:pointer}input[type=number]{width:100%;background:#0c1923;border:1px solid #435967;border-radius:8px;color:#fff;padding:11px 12px;font:inherit;min-width:0}input:focus-visible,button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}input:invalid{border-color:#ff968f}input[type=checkbox]{width:20px;height:20px;accent-color:var(--mint);flex-shrink:0}small,.hint{color:var(--muted);font-size:14px}.fields label>span{display:block;margin-bottom:8px}.row{border-top:1px solid var(--line);padding:16px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.row:last-child{padding-bottom:0}.row:first-of-type{border-top:0;padding-top:0}.check{display:flex;align-items:center;gap:10px}.points{color:var(--mint);white-space:nowrap;font-variant-numeric:tabular-nums}.negative{color:#ffac9f}.sub{margin:10px 0 0 30px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}.sub:has(input:disabled){opacity:.45}.stepper{display:flex;gap:6px;align-items:center}.stepper input{width:75px;text-align:center;padding:8px 3px}.stepper button{width:40px;height:42px;border-radius:8px;border:1px solid #49675f;background:#213f3a;color:var(--mint);font:24px system-ui;cursor:pointer}.stepper button:hover{background:#30554b}.row-title small{display:block;margin-top:2px}.total{position:sticky;top:24px;background:#163a35;border-color:#315d51}.eyebrow{font-size:14px;color:#c1dcd2}.score{font-size:54px;font-weight:700;line-height:1.25;margin:16px 0 6px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums;color:#a0ffdc}.score small{font-weight:400;font-size:16px;color:#c1dcd2}.breakdown{margin-top:26px;border-top:1px solid #396155;padding-top:12px}.line{display:flex;justify-content:space-between;gap:12px;margin:12px 0;font-size:14px}.formula{font-size:14px;color:#bdd6cc;border-top:1px solid #396155;padding-top:18px;margin-top:20px}.notice{font-size:14px;color:#e5d591;min-height:24px}.time-input{display:flex;align-items:center;gap:12px}.time-input input{max-width:190px}.time-result{color:var(--mint);margin-top:14px}.hint{margin:12px 0 0}button.reset{background:transparent;color:var(--muted);border:1px solid var(--line);padding:9px 14px;border-radius:8px;font:14px system-ui;cursor:pointer}button.reset:hover{color:#fff;border-color:#a9bcc8}@media(max-width:800px){.layout{grid-template-columns:1fr}.total{position:static;grid-row:1}.score{font-size:44px}.breakdown{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin-top:16px}.formula{margin-top:12px}main{padding:22px 14px}.panel{padding:20px}.fields{gap:12px}h1{font-size:24px}}@media(max-width:380px){.fields{grid-template-columns:1fr}.row{gap:6px}.stepper input{width:58px}.panel{padding:16px}}
</style></head><body><main><header><div class="mark"><h1>黑流树海计分台</h1></div><button class="reset" id="reset" type="button">清空本局</button></header><div class="layout"><div><section class="panel"><h2><span>01</span> 通关结算</h2><div class="fields"><label><span>游戏内结算分</span><input id="settlement" type="number" min="0" step="1" placeholder="输入结算得分"></label><label><span>零件数量</span><input id="parts" type="number" min="0" step="1" placeholder="输入零件个数"></label></div></section><section class="panel"><h2><span>02</span> 作战加分 <small>每项限一次</small></h2><div id="combat"></div></section><section class="panel"><h2><span>03</span> 非作战加分</h2><div id="repeat"></div></section><section class="panel"><h2><span>04</span> 游戏耗时</h2><label class="time-input"><input id="minutes" aria-label="游戏耗时（分钟）" type="number" min="0" step="any" placeholder="输入耗时"><span>分钟</span></label><div id="time-result" class="time-result">未填写，暂不计时间分</div></section></div><aside class="panel total"><div class="eyebrow">个人得分</div><div class="score"><output id="total" aria-live="polite">0</output> <small>分</small></div><div class="notice" id="notice">填写结算数据后得出最终得分</div><div class="breakdown"><div class="line"><span>结算分</span><span id="raw">0</span></div><div class="line"><span>扣除零件得分</span><span id="deduct">0</span></div><div class="line"><strong>最终基础分</strong><strong id="base">0</strong></div><div class="line"><span>作战加分</span><span id="combat-sum">0</span></div><div class="line"><span>非作战加分</span><span id="repeat-sum">0</span></div><div class="line"><span>时间得分</span><span id="time-sum">0</span></div><div class="line"><strong>特殊得分合计</strong><strong id="special">0</strong></div></div><div class="formula">个人得分 =<br>（结算分 − 零件数量 × 5）÷ 2<br>＋ 作战加分 ＋ 非作战加分 ＋ 时间得分</div></aside></div></main><script>
const combat=[['noexp','五层前·无效验尸',150],['meeting','紧急·合伙人会议',100],['black','“黑诞”中任意关卡',120],['ending','五层结局',300,true],['disease','畸症',500,true]];
const repeats=[['blackman','每个小黑人',120],['hunt','每次追猎',40],['fruit','果 / 轮额外扣分',-80],['recruit4','4 星临时招募',10],['recruit5','5 星临时招募',20],['recruit6','6 星临时招募',50],['duck','鸭狗熊鼠',20],['naked','襁褓生灵',100]];
const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);const signed=n=>(n>0?'+':'')+fmt(n);
$('combat').innerHTML=combat.map(([id,name,points,boss])=>`<div class="row"><div><label class="check"><input id="${id}" type="checkbox"><span>${name}</span></label>${id==='ending'?'<small style="display:block;margin-left:30px">痛苦将息 / 混沌源阶理论</small>':''}${boss?`<label class="sub"><input id="${id}-failed" type="checkbox" disabled>未击败 BOSS（仅计 25%）</label>`:''}</div><span class="points" id="${id}-points">+${points}</span></div>`).join('');
$('repeat').innerHTML=repeats.map(([id,name,points])=>`<div class="row"><div class="row-title"><label for="${id}">${name}</label><small class="${points<0?'negative':''}">${signed(points)} 分 / 次 · <span id="${id}-subtotal">0</span> 分</small></div><div class="stepper"><input id="${id}" type="number" min="0" max="999999999" step="1" value="0" aria-label="${name}次数"><button type="button" data-add="${id}" aria-label="${name}加一次">+</button></div></div>`).join('');
function number(id){return $(id).value===''?0:Number($(id).value)}
function calculate(){for(const [id,,,boss]of combat){if(boss){$(id+'-failed').disabled=!$(id).checked;if(!$(id).checked)$(id+'-failed').checked=false}$(id+'-points').textContent=signed(combat.find(x=>x[0]===id)[2]*(boss&&$(id+'-failed').checked?.25:1))}const invalid=[...document.querySelectorAll('input[type=number]')].some(e=>!e.validity.valid||!Number.isFinite(Number(e.value)));if(invalid){$('total').textContent='—';$('notice').textContent='请修正输入：次数和数量应为非负整数。';for(const id of ['raw','deduct','base','combat-sum','repeat-sum','time-sum','special'])$(id).textContent='—';return null}let c=0,r=0;for(const[id,,p,boss]of combat)c+=$(id).checked?p*(boss&&$(id+'-failed').checked?.25:1):0;for(const[id,,p]of repeats){r+=number(id)*p;$(id+'-subtotal').textContent=signed(number(id)*p)}const t=$('minutes').value===''?0:number('minutes')<150?150:number('minutes')>180?-(number('minutes')-180)*10:0;const raw=number('settlement'),deduct=number('parts')*5,base=(raw-deduct)/2,special=c+r+t,total=base+special;for(const[id,n]of Object.entries({raw,deduct:-deduct,base,'combat-sum':c,'repeat-sum':r,'time-sum':t,special,total}))$(id).textContent=fmt(n);$('time-result').textContent=$('minutes').value===''?'未填写，暂不计时间分':`时间得分 ${signed(t)} 分`;$('notice').textContent=$('settlement').value===''||$('parts').value===''?'填写结算分和零件数量后完成结算':$('minutes').value===''?'尚未填写耗时，时间得分暂按 0 分':'已按当前输入实时结算';return{base,combat:c,nonCombat:r,time:t,special,total}}
document.addEventListener('input',calculate);document.addEventListener('change',calculate);document.addEventListener('click',e=>{const id=e.target.dataset.add;if(id){const n=number(id);if(Number.isSafeInteger(n)&&n>=0&&n<999999999){$(id).value=n+1;calculate()}}});$('reset').onclick=()=>{if(!confirm('清空本局所有输入和勾选？'))return;document.querySelectorAll('input').forEach(e=>{if(e.type==='checkbox')e.checked=false;else e.value=repeats.some(x=>x[0]===e.id)?'0':''});calculate()};calculate();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_score',description:'读取当前页面个人得分及各项分数；输入无效时返回 null。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>calculate()})).catch(()=>{})}catch{}}
</script></body></html>
